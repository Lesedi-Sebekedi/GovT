name: Update vacancies and deploy

on:
  schedule:
    - cron: "0 5,12 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF extraction dependency
        run: python -m pip install -r requirements.txt
      - name: Test vacancy extraction
        run: python -m unittest discover -s tests -v
      - name: Refresh listings from DPSA circulars
        run: python scripts/update_vacancies.py
      - name: Commit refreshed vacancy data
        run: |
          if git diff --quiet -- vacancies.js data/vacancies.json data/circular-state.json; then
            echo "Vacancy data is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vacancies.js data/vacancies.json data/circular-state.json
            git commit -m "Update vacancies from DPSA circulars"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload updated static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
